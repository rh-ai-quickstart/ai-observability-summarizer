# Default values for tempo-stack
replicaCount: 1

nameOverride: ""
fullnameOverride: ""

# Global configuration
global:
  namespace: observability-hub

# TempoStack configuration
tempoStack:
  name: tempostack
  storageSize: 15Gi
  
  # Resource limits for TempoStack
  resources:
    total:
      limits:
        memory: 10Gi
        cpu: 5000m
      requests:
        memory: 2Gi
        cpu: 1000m
  
  # Tenant configuration
  tenants:
    mode: openshift
    authentication:
      - tenantName: dev
        tenantId: "1610b0c3-c509-4592-a256-a1871353dbfa"
  
  # Template configuration
  template:
    gateway:
      enabled: true
    queryFrontend:
      jaegerQuery:
        enabled: true
        # ingress:
        #   type: route

s4:
  # S4 is in ai-observability; Tempo is in observability-hub.
  secret:
    create: true # Umbrella chart creates this mirror from its S4 values instead.
  s3:
    accessKeyId: "s4admin"
    secretAccessKey: "s4secret"
    bucket: tempo
    endpoint: http://s4.ai-observability.svc.cluster.local:7480

# RBAC configuration
rbac:
  create: true
  
# Security configuration
podSecurityContext:
  runAsNonRoot: true

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
    - ALL
  readOnlyRootFilesystem: false
  runAsNonRoot: true

# Node selector
nodeSelector: {}

# Tolerations
tolerations: []

# Affinity
affinity: {}

# Additional labels and annotations
commonLabels: {}
commonAnnotations: {}
