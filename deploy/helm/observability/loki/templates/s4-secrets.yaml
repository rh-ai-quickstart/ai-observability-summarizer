{{- $s4 := index .Values "s4" | default dict -}}
{{- $secret := index $s4 "secret" | default dict -}}
{{- $s3 := index $s4 "s3" | default dict -}}
{{- $create := true -}}
{{- if hasKey $secret "create" -}}
  {{- $create = index $secret "create" -}}
{{- end -}}
{{- if $create }}
# S3 credentials copied into the Loki namespace for the S4 backend.
apiVersion: v1
kind: Secret
metadata:
  name: s4-loki-credentials
  namespace: {{ include "loki-stack.namespace" . }}
  labels:
    {{- include "loki-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki-storage
    {{- with .Values.commonLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
type: Opaque
stringData:
  access_key_id: {{ required "s4.s3.accessKeyId is required" (index $s3 "accessKeyId") | quote }}
  access_key_secret: {{ required "s4.s3.secretAccessKey is required" (index $s3 "secretAccessKey") | quote }}
  bucketnames: {{ required "s4.s3.bucket is required" (index $s3 "bucket") | quote }}
  endpoint: {{ required "s4.s3.endpoint is required" (index $s3 "endpoint") | quote }}
{{- end }}
