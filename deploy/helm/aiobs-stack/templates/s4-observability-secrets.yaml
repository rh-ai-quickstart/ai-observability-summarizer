{{- $s4 := index .Values "aws-compatible-storage" -}}
{{- if or .Values.tempo.s4.secret.create .Values.loki.s4.secret.create -}}
  {{- fail "The aiobs-stack parent creates the Tempo and Loki S4 credential mirrors; keep tempo.s4.secret.create and loki.s4.secret.create false." -}}
{{- end -}}
{{- if ne $s4.fullnameOverride (include "s4.fullname" .) -}}
  {{- fail "aiobs-stack requires aws-compatible-storage.fullnameOverride=s4 so the S4 endpoint and Secret names match." -}}
{{- end -}}
{{- if $s4.s3.existingSecret -}}
  {{- fail "aiobs-stack mirrors S4 credentials across namespaces; set aws-compatible-storage.s3.accessKeyId and secretAccessKey instead of s3.existingSecret." -}}
{{- end -}}
{{- $accessKey := required "aws-compatible-storage.s3.accessKeyId is required" $s4.s3.accessKeyId -}}
{{- $secretKey := required "aws-compatible-storage.s3.secretAccessKey is required" $s4.s3.secretAccessKey -}}
{{- $endpoint := printf "http://%s.%s.svc.cluster.local:%s" (include "s4.fullname" .) .Release.Namespace (include "s4.apiPort" .) -}}
apiVersion: v1
kind: Secret
metadata:
  name: s4-tempo-credentials
  namespace: {{ .Values.global.observabilityNamespace }}
  labels:
    {{- include "aiobs-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: tempo-storage
type: Opaque
stringData:
  access_key_id: {{ $accessKey | quote }}
  access_key_secret: {{ $secretKey | quote }}
  bucket: {{ .Values.tempo.s4.s3.bucket | quote }}
  endpoint: {{ $endpoint | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: s4-loki-credentials
  namespace: {{ .Values.global.lokiNamespace }}
  labels:
    {{- include "aiobs-stack.labels" . | nindent 4 }}
    app.kubernetes.io/component: loki-storage
type: Opaque
stringData:
  access_key_id: {{ $accessKey | quote }}
  access_key_secret: {{ $secretKey | quote }}
  bucketnames: {{ .Values.loki.s4.s3.bucket | quote }}
  endpoint: {{ $endpoint | quote }}
