# AI Observability Summarizer - Full Stack Values
# Single umbrella chart combining all application and infrastructure components

# =============================================================================
# GLOBAL SETTINGS
# =============================================================================

# Global settings shared across all subcharts
global:
  observabilityNamespace: observability-hub
  lokiNamespace: openshift-logging
  korrel8rNamespace: openshift-cluster-observability-operator
  # Development mode - enables browser-cached API keys (sessionStorage)
  # Default: false (production mode)
  devMode: false

# =============================================================================
# APPLICATION COMPONENTS (deployed in CR namespace)
# =============================================================================

# MCP Server - Model Context Protocol server for AI observability
mcpServer:
  enabled: true  # Always deployed
  image:
    repository: quay.io/ecosystem-appeng/aiobs-mcp-server
    tag: 3.2.0
    pullPolicy: Always
  # NOTE: DEV_MODE env var is automatically set from global.devMode by mcp-server chart
  rbac:
    # Empty string means auto-use parent release name (for umbrella chart deployments)
    lokiReleaseName: ""

# OpenShift Console Plugin - Native console integration
consolePlugin:
  enabled: true  # Always deployed
  plugin:
    name: "aiobs-console-plugin"
    description: "AI Observability Plugin"
    image:
      repository: quay.io/ecosystem-appeng/aiobs-console-plugin
      tag: 3.2.0
    imagePullPolicy: Always
    replicas: 2
    port: 9443

# Alerting - Alert processing CronJob
alerting:
  enabled: false  # Optional - toggle in OLM form

# RAG - LLM Stack (llama-stack, llm-service, pgvector)
rag:
  enabled: true  # Always enabled

  # LlamaStack deployment mode
  llama-stack:
    # Set to true to deploy LlamaStack via LlamaStackDistribution CRD (requires RHOAI 3.x
    # with LlamaStack operator enabled). When false, deploys as a regular Helm Deployment.
    managedByOperator: false

  # Model selection - Enable ONE model via OLM UI toggle
  global:
    models:
      # Default: Llama 3.1 8B (RECOMMENDED, 16GB GPU)
      llama-3-1-8b-instruct:
        enabled: true
  
  # LLM Service configuration
  llm-service:
    device: gpu  # Options: gpu, hpu, gpu-amd, cpu
    secret:
      hf_token: ""  # Required - set via OLM UI

# =============================================================================
# INFRASTRUCTURE COMPONENTS (deployed to fixed namespaces)
# Core infrastructure is enabled by default; the S4 chart has an explicit condition.
# Matches 'make install' behavior - single CR per cluster
# =============================================================================

# TempoStack - Distributed tracing backend (observability-hub)
tempo:
  s4:
    secret:
      create: false # Parent chart mirrors credentials from aws-compatible-storage.s3.
    s3:
      bucket: tempo

# LokiStack - Log aggregation (openshift-logging)
# NOTE: Makefile sets rbac.collector.create dynamically; Operator uses loki-rbac-job.yaml
loki:
  lokiStack:
    storageClassName: "auto"  # Auto-detect cluster default storage class (or specify: gp3, gp2, standard, managed-premium, thin, etc.)
  global:
    namespace: openshift-logging  # Deploy LokiStack to openshift-logging (not ai-observability)
  rbac:
    collector:
      create: false  # Disabled - RBAC created by loki-rbac-job.yaml to avoid Helm ownership conflicts
  s4:
    secret:
      create: false # Parent chart mirrors credentials from aws-compatible-storage.s3.
    s3:
      bucket: loki

# OpenTelemetry Collector - Trace/metric collection (observability-hub)
otelCollector: {}

# Korrel8r - Signal correlation engine (openshift-cluster-observability-operator)
korrel8r:
  loki:
    # Empty triggers dynamic name: {{ .Release.Name }}-loki-stack (matches loki chart's clusterResourceName)
    releaseName: ""

# aws-compatible-storage (S4) - storage in the operator release namespace.
# This S3 block is the single credential source for S4, Tempo, and Loki when
# deploying the umbrella/operator chart. The parent creates namespace mirrors.
aws-compatible-storage:
  enabled: true
  fullnameOverride: s4
  image:
    repository: quay.io/rh-aiservices-bu/s4
    tag: "0.3.2"
    pullPolicy: IfNotPresent
  s3:
    accessKeyId: s4admin # Demo value; override for shared or production clusters.
    secretAccessKey: s4secret # Demo value; override for shared or production clusters.
    region: us-east-1
  auth:
    enabled: true
    username: admin
    password: changeme # Demo value; override for shared or production clusters.
  route:
    # Keep the public S4 UI Route off while the demo auth values are in use.
    # Change auth.username and auth.password before enabling this Route.
    enabled: false
    s3Api:
      enabled: false
  storage:
    data:
      size: 10Gi
  # S4 0.3.2 runs RGW under Supervisor. Its default 1024 soft FD limit caused
  # failed Tempo PUTs; the parent chart supplies the image's config with
  # minfds=65536, which RGW inherits.
  extraVolumes:
    - name: s4-supervisord-config
      configMap:
        name: s4-supervisord-config
  extraVolumeMounts:
    - name: s4-supervisord-config
      mountPath: /etc/supervisord.conf
      subPath: supervisord.conf
      readOnly: true

# The parent chart creates buckets as a regular Job (not a Helm hook).
awsCompatibleStorageBuckets:
  create: true
  names:
    - tempo
    - loki
  namesCsv: "" # Optional comma-separated override for standalone Make installs.

# Python image used by the parent-chart bucket bootstrap Job.
jobImages:
  python: registry.redhat.io/ubi9/python-311:latest

# =============================================================================
# AUTO-INSTRUMENTATION (for automatic tracing of Python applications)
# =============================================================================

# Instrumentation CR - creates auto-instrumentation for Python apps
# To enable for a namespace: oc annotate namespace <ns> instrumentation.opentelemetry.io/inject-python="true"
instrumentation:
  enabled: true
  name: python-instrumentation
  exporter:
    endpoint: http://otel-collector-collector.observability-hub.svc.cluster.local:4318
  propagators:
    - tracecontext
    - baggage
    - b3
  python:
    image: "ghcr.io/open-telemetry/opentelemetry-operator/autoinstrumentation-python:latest"
    env:
      - name: OTEL_PYTHON_PLATFORM
        value: "glibc"
