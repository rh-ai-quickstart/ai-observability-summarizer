# Use the 'create api' subcommand to add watches to this file.
- group: aiobs.rh-ai-quickstart.io
  version: v1alpha1
  kind: AIObservabilitySummarizer
  chart: helm-charts/aiobs-stack
  # Server-side dry run lets chart lookups (e.g. the default StorageClass) resolve during
  # drift detection; with client-side dry run they render differently and force an upgrade
  # on every reconcile.
  dryRunOption: server
#+kubebuilder:scaffold:watch

